[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "managed-platform-builder"
version = "0.1.0"
description = "Visible desktop configuration builder for managed endpoint deployments"
requires-python = ">=3.12"
dependencies = [
  "PySide6>=6.8,<7.0",
  "pydantic>=2.9,<3.0",
  "jsonschema[format]>=4.23,<5.0"
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9.0", "pytest-qt>=4.4,<5.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
